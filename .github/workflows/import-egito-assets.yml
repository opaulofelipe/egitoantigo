name: Import Egypt Assets
on:
  push:
    paths:
      - "_asset_upload/READY"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild asset archive
        shell: bash
        run: |
          cat _asset_upload/chunk*.txt > /tmp/egito-assets.b64
          base64 --decode /tmp/egito-assets.b64 > /tmp/egito-assets.zip
          mkdir -p assets
          unzip -o /tmp/egito-assets.zip -d assets
          rm -rf _asset_upload
      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add Ancient Egypt game assets"
          git push
